# Revisión semanal de dependencias. El grupo `astro` mantiene juntos los
# paquetes que comparten versión mayor: subir el adapter sin subir Astro
# rompe el peer y viceversa.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Santiago
    open-pull-requests-limit: 5
    # TypeScript 7 todavía no: el peer de @astrojs/check@0.9.10 —la última
    # publicada— es `^5.0.0 || ^6.0.0`, así que la PR revienta el npm install
    # con ERESOLVE. Se revisa cuando salga una versión que lo acepte.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
      supabase:
        patterns:
          - "@supabase/*"
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
          - daisyui

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
